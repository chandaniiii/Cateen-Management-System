<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="200" rx="140" ry="50" fill="#cbd5e1" filter="url(#shadow)"/>
  <ellipse cx="200" cy="180" rx="130" ry="60" fill="#334155"/>
  <ellipse cx="200" cy="175" rx="120" ry="50" fill="#1e293b"/>
  
  <!-- Chowmein Noodles -->
  <path d="M110,165 Q150,130 200,160 T290,165" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <path d="M120,175 Q170,140 210,170 T280,170" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
  <path d="M130,155 Q180,125 230,160 T270,150" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <path d="M105,180 Q160,195 210,165 T295,175" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
  <path d="M140,160 Q190,145 240,175 T260,160" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>

  <!-- Veggie garnishes & chili shreds -->
  <!-- Green peppers / coriander -->
  <rect x="150" y="145" width="18" height="5" rx="2" fill="#10b981" transform="rotate(15 150 145)"/>
  <rect x="220" y="150" width="22" height="5" rx="2" fill="#059669" transform="rotate(-25 220 150)"/>
  <rect x="180" y="165" width="16" height="5" rx="2" fill="#10b981" transform="rotate(45 180 165)"/>
  <!-- Red chili / carrots -->
  <rect x="170" y="140" width="16" height="4" rx="2" fill="#ef4444" transform="rotate(-30 170 140)"/>
  <rect x="250" y="160" width="18" height="4" rx="2" fill="#f97316" transform="rotate(20 250 160)"/>
  
  <!-- Chopsticks -->
  <line x1="280" y1="90" x2="190" y2="160" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  <line x1="295" y1="85" x2="205" y2="162" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>

  <!-- Steam -->
  <path d="M170,110 Q160,90 170,70" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M220,105 Q210,85 220,65" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
