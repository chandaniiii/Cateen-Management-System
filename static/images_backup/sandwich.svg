<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Wooden Plate / Board -->
  <ellipse cx="200" cy="180" rx="140" ry="60" fill="#d97706" filter="url(#shadow)"/>
  <ellipse cx="200" cy="175" rx="130" ry="52" fill="#fef3c7"/>
  
  <!-- Triangle Sandwich 1 -->
  <g filter="url(#shadow)">
    <!-- Bottom Bread -->
    <path d="M120,180 L230,130 L250,195 Z" fill="#b45309"/>
    <path d="M125,175 L225,130 L245,190 Z" fill="#fde68a"/>
    <!-- Fillings Layer -->
    <!-- Lettuce -->
    <path d="M125,170 Q140,165 160,172 T200,165 T240,185" fill="none" stroke="#22c55e" stroke-width="6"/>
    <!-- Tomato -->
    <path d="M130,165 L220,135" fill="none" stroke="#ef4444" stroke-width="4"/>
    <!-- Cheese (melted dripping) -->
    <path d="M135,160 L230,138" fill="none" stroke="#eab308" stroke-width="5"/>
    <path d="M165,165 Q165,175 168,175 Q171,175 171,163" fill="#eab308"/>
    <!-- Top Bread with Grill Marks -->
    <path d="M125,155 L225,110 L245,170 Z" fill="#fde68a"/>
    <path d="M120,158 L223,108 L250,173 Z" fill="none" stroke="#b45309" stroke-width="3"/>
    <!-- Grill lines -->
    <line x1="150" y1="160" x2="175" y2="135" stroke="#92400e" stroke-width="2.5"/>
    <line x1="175" y1="165" x2="200" y2="140" stroke="#92400e" stroke-width="2.5"/>
    <line x1="200" y1="170" x2="225" y2="145" stroke="#92400e" stroke-width="2.5"/>
  </g>
</svg>
