<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="190" rx="130" ry="50" fill="#cbd5e1" filter="url(#shadow)"/>
  <ellipse cx="200" cy="175" rx="120" ry="50" fill="#dc2626"/>
  <ellipse cx="200" cy="170" rx="110" ry="42" fill="#b91c1c"/>
  
  <!-- Crunchy Crushed Wai Wai Noodles & Sadeko Mix -->
  <ellipse cx="200" cy="165" rx="100" ry="38" fill="#fde047"/>
  
  <!-- Noodle Curls -->
  <path d="M120,165 Q140,150 160,165 T200,165" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <path d="M150,175 Q175,155 200,175 T250,170" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <path d="M210,155 Q235,140 260,160 T280,165" fill="none" stroke="#d97706" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M135,155 Q160,140 185,155" fill="none" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Diced Red Onions, Tomatoes, Green Chillies -->
  <rect x="150" y="150" width="8" height="8" rx="2" fill="#9333ea"/>
  <rect x="180" y="145" width="9" height="7" rx="2" fill="#ef4444"/>
  <rect x="220" y="160" width="8" height="8" rx="2" fill="#9333ea"/>
  <rect x="240" y="150" width="9" height="7" rx="2" fill="#ef4444"/>
  <circle cx="165" cy="170" r="3" fill="#16a34a"/>
  <circle cx="195" cy="160" r="3" fill="#16a34a"/>
  <circle cx="230" cy="170" r="3" fill="#16a34a"/>
  
  <!-- Lemon Wedge on Bowl Rim -->
  <path d="M275,130 A25,25 0 0,1 295,155 L275,155 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <path d="M276,134 A21,21 0 0,1 292,153 L276,153 Z" fill="#84cc16"/>
</svg>
