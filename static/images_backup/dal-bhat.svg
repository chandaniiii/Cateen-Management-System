<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Brass Thali (Plate) -->
  <ellipse cx="200" cy="165" rx="145" ry="75" fill="url(#brass)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="162" rx="138" ry="70" fill="#fef3c7"/>
  <ellipse cx="200" cy="160" rx="130" ry="65" fill="#fffbeb"/>
  
  <!-- Center Rice Mound (Bhat) -->
  <ellipse cx="200" cy="160" rx="45" ry="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Coriander garnish on rice -->
  <circle cx="200" cy="155" r="3" fill="#16a34a"/>
  <circle cx="196" cy="157" r="2.5" fill="#22c55e"/>
  
  <!-- Katori 1: Dal (Yellow Lentil Soup) - Top Left -->
  <circle cx="140" cy="125" r="25" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
  <circle cx="140" cy="125" r="21" fill="#fbbf24"/>
  <circle cx="138" cy="122" r="3" fill="#15803d"/>

  <!-- Katori 2: Tarkari (Curry/Veggies) - Top Right -->
  <circle cx="260" cy="125" r="25" fill="#ea580c" stroke="#c2410c" stroke-width="3"/>
  <circle cx="260" cy="125" r="21" fill="#f97316"/>
  <rect x="252" y="120" width="8" height="6" rx="2" fill="#22c55e"/>
  <circle cx="268" cy="126" r="4" fill="#fbbf24"/>

  <!-- Katori 3: Saag (Spinach / Greens) - Bottom Left -->
  <circle cx="135" cy="180" r="22" fill="#15803d" stroke="#166534" stroke-width="3"/>
  <circle cx="135" cy="180" r="18" fill="#16a34a"/>
  
  <!-- Katori 4: Achar / Pickle (Red spicy) - Bottom Right -->
  <circle cx="265" cy="180" r="20" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <circle cx="265" cy="180" r="16" fill="#ef4444"/>
  
  <!-- Papad (Crisp wafer) on edge -->
  <ellipse cx="200" cy="205" rx="30" ry="12" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-5 200 205)"/>
  
  <!-- Steam from Rice -->
  <path d="M195,115 Q190,95 195,75" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M208,118 Q213,98 208,78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
