<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="lassi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <ellipse cx="200" cy="245" rx="60" ry="16" fill="#cbd5e1" opacity="0.6"/>
  
  <!-- Matka / Tall Clay Pot / Glass for Lassi -->
  <g filter="url(#shadow)">
    <!-- Glass body -->
    <path d="M145,100 L160,230 C160,240 240,240 240,230 L255,100 Z" fill="url(#lassi)"/>
    <path d="M145,100 L160,230 C160,240 240,240 240,230 L255,100 Z" fill="#e0f2fe" opacity="0.3"/>
    
    <!-- Rich Creamy Froth & Malai Layer -->
    <ellipse cx="200" cy="100" rx="55" ry="18" fill="#fef9c3"/>
    <ellipse cx="200" cy="98" rx="50" ry="15" fill="#fef08a"/>
    
    <!-- Malai Dollop -->
    <path d="M190,95 Q200,80 215,92 Q205,102 190,95 Z" fill="#ffffff"/>
    
    <!-- Pistachio & Saffron Garnishes -->
    <ellipse cx="180" cy="95" rx="4" ry="2" fill="#15803d" transform="rotate(30 180 95)"/>
    <ellipse cx="220" cy="92" rx="4" ry="2" fill="#15803d" transform="rotate(-20 220 92)"/>
    <line x1="195" y1="90" x2="205" y2="88" stroke="#dc2626" stroke-width="2"/>
    <line x1="210" y1="96" x2="218" y2="100" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  
  <!-- Striped Straw -->
  <g transform="rotate(18 200 100)">
    <line x1="200" y1="20" x2="200" y2="180" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="40" x2="200" y2="55" stroke="#ffffff" stroke-width="8"/>
    <line x1="200" y1="75" x2="200" y2="90" stroke="#ffffff" stroke-width="8"/>
    <line x1="200" y1="110" x2="200" y2="125" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
