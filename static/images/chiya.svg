<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="chiya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="240" rx="60" ry="16" fill="#cbd5e1" opacity="0.6"/>
  
  <!-- Classic Nepali Canteen Cutting Glass -->
  <g filter="url(#shadow)">
    <!-- Glass body filled with Spiced Masala Chiya -->
    <path d="M150,110 L165,225 C165,235 235,235 235,225 L250,110 Z" fill="url(#chiya)"/>
    <!-- Glass walls highlight -->
    <path d="M150,110 L165,225 C165,235 235,235 235,225 L250,110 Z" fill="url(#glass)"/>
    
    <!-- Ribbed Glass Cuts / Grooves -->
    <line x1="175" y1="120" x2="182" y2="215" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="200" y1="120" x2="200" y2="220" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="225" y1="120" x2="218" y2="215" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

    <!-- Frothy Tea Surface -->
    <ellipse cx="200" cy="110" rx="50" ry="15" fill="#fef3c7"/>
    <ellipse cx="200" cy="111" rx="46" ry="12" fill="#d97706"/>
    <!-- Foam bubbles -->
    <circle cx="180" cy="111" r="3" fill="#fef3c7"/>
    <circle cx="215" cy="112" r="3" fill="#fef3c7"/>
    <circle cx="195" cy="108" r="2.5" fill="#fef3c7"/>
  </g>
  
  <!-- Fresh Tea Steam -->
  <path d="M185,85 Q175,60 185,35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M215,80 Q225,55 215,30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
